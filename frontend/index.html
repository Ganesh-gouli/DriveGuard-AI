<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <title>Driver Drowsiness - Landing</title>
  <link rel="stylesheet" href="../backend/static/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body style="justify-content: center;">
  <div class="glass-panel" style="max-width: 800px; padding: 60px; text-align: center;">
    <div style="font-size: 64px; color: var(--primary); margin-bottom: 20px;">
      <i class="fas fa-eye"></i>
    </div>
    <h1
      style="font-size: 48px; margin-bottom: 16px; background: linear-gradient(135deg, #fff, #94a3b8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      Driver AI</h1>
    <p style="font-size: 20px; color: var(--text-muted); margin-bottom: 40px;">Advanced Real-time Drowsiness &
      Distraction Detection System</p>

    <div style="display: flex; gap: 20px; justify-content: center; margin-bottom: 40px;">
      <div class="stat-card glass-panel" style="width: 200px; height: auto; padding: 20px;">
        <i class="fas fa-video" style="font-size: 32px; color: var(--primary); margin-bottom: 10px;"></i>
        <div style="font-weight: 600;">Computer Vision</div>
      </div>
      <div class="stat-card glass-panel" style="width: 200px; height: auto; padding: 20px;">
        <i class="fas fa-brain" style="font-size: 32px; color: var(--success); margin-bottom: 10px;"></i>
        <div style="font-weight: 600;">AI Analysis</div>
      </div>
      <div class="stat-card glass-panel" style="width: 200px; height: auto; padding: 20px;">
        <i class="fas fa-bell" style="font-size: 32px; color: var(--danger); margin-bottom: 10px;"></i>
        <div style="font-weight: 600;">Instant Alerts</div>
      </div>
    </div>

    <a href="http://localhost:5000/dashboard" class="btn-primary"
      style="text-decoration: none; font-size: 18px; padding: 16px 40px; display: inline-block;">
      Launch Dashboard <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
    </a>

    <div style="margin-top: 60px; text-align: left; background: rgba(0,0,0,0.2); padding: 20px; border-radius: 12px;">
      <h3 style="color: var(--text-main); margin-bottom: 10px;">Quick Start Guide</h3>
      <ol style="color: var(--text-muted); padding-left: 20px; line-height: 1.8;">
        <li>Start backend: <code
            style="color: var(--primary); background: rgba(59, 130, 246, 0.1); padding: 2px 6px; border-radius: 4px;">python backend/app.py</code>
        </li>
        <li>Start detection: <code
            style="color: var(--primary); background: rgba(59, 130, 246, 0.1); padding: 2px 6px; border-radius: 4px;">python detection/detect.py</code>
        </li>
        <li>Access Dashboard: <code
            style="color: var(--primary); background: rgba(59, 130, 246, 0.1); padding: 2px 6px; border-radius: 4px;">http://localhost:5000/dashboard</code>
        </li>
      </ol>
    </div>
  </div>
</body>

</html>
