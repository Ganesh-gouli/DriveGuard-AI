<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - Driver AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card glass-panel">
            <div class="login-header">
                <h1 class="login-title">Driver AI</h1>
                <p class="login-subtitle">Drowsiness Detection System</p>
            </div>

            <div id="errorBox" class="error-message"
                style="display:none; color: var(--neon-red); margin-bottom: 20px; background: rgba(239,68,68,0.1); padding: 10px; border-radius: 8px;">
            </div>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group" style="margin-bottom: 20px; text-align: left;">
                    <label for="driverName"
                        style="display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 14px;">Driver
                        Name</label>
                    <input type="text" id="driverName" placeholder="Enter your name" required>
                </div>

                <div class="form-group" style="margin-bottom: 32px; text-align: left;">
                    <label for="carNumber"
                        style="display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 14px;">Car
                        Number</label>
                    <input type="text" id="carNumber" placeholder="XX-00-XX-0000" required>
                </div>

                <button type="submit" class="btn-neon" style="width: 100%;">
                    Login <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
                </button>
            </form>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();

            const driverName = document.getElementById('driverName').value.trim();
            const carNumber = document.getElementById('carNumber').value.trim();
            const errorBox = document.getElementById('errorBox');

            // Reset error
            errorBox.style.display = 'none';
            errorBox.textContent = '';

            // Validation
            if (!driverName) {
                showError("Driver Name is required.");
                return;
            }

            const carNumberRegex = /^[A-Z]{2}-\d{2}-[A-Z]{2}-\d{4}$/;
            const formattedCarNumber = carNumber.toUpperCase();

            if (!carNumberRegex.test(formattedCarNumber)) {
                showError("Invalid Car Number. Format: XX-00-XX-0000");
                return;
            }

            // Save to localStorage
            localStorage.setItem('driverName', driverName);
            localStorage.setItem('carNumber', formattedCarNumber);

            // Redirect
            window.location.href = '/dashboard';
        }

        function showError(msg) {
            const errorBox = document.getElementById('errorBox');
            errorBox.textContent = msg;
            errorBox.style.display = 'block';
        }
    </script>
</body>

</html>
