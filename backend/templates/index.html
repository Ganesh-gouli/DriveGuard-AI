<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Driver AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="login-wrapper">
        <div class="login-card glass-panel">
            <div class="login-logo">
                <i class="fas fa-eye" style="color: var(--neon-purple);"></i> Driver AI
            </div>
            <p class="login-subtitle">Advanced Drowsiness Detection System</p>

            <div id="errorBox" class="error-msg"></div>

            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">Driver Name</label>
                    <input type="text" id="driverName" class="form-input" placeholder="Enter your name">
                </div>

                <div class="form-group">
                    <label class="form-label">Car Number</label>
                    <input type="text" id="carNumber" class="form-input" placeholder="XX-00-XX-0000">
                </div>

                <button type="submit" class="btn-primary">
                    Login <i class="fas fa-arrow-right" style="margin-left: 8px;"></i>
                </button>
            </form>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>

</html>
